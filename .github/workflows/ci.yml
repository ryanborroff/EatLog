name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm, from package-lock.json: the same install that local development
      # and the Fastlane TestFlight builds use, so CI checks what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Bundling resolves every import the app makes at runtime, so this
      # catches "the app won't start" problems the type check and tests miss
      # (e.g. a package that's used but not installed).
      - name: Bundle the iOS app
        run: npx expo export --platform ios --output-dir "${{ runner.temp }}/bundle"
